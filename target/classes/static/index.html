<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wallet Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen">

<!-- Giriş & Kayıt Ekranı -->
<div id="authSection" class="flex justify-center items-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">Dijital Cüzdan Girişi</h2>
        <div id="authAlert" class="hidden mb-4 p-3 text-sm rounded-lg"></div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">E-Posta</label>
                <input type="email" id="loginEmail" required class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Şifre</label>
                <input type="password" id="loginPassword" required class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition">Giriş Yap</button>
        </form>
    </div>
</div>

<!-- Ana Panel / Cüzdan Ekranı (Varsayılan Gizli) -->
<div id="dashboardSection" class="hidden min-h-screen p-6">
    <!-- Üst Bar -->
    <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-6">
        <h1 class="text-xl font-bold text-gray-800"><i class="fa-solid font-wallet text-indigo-600"></i> Dijital Cüzdanım</h1>
        <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition text-sm">Çıkış Yap</button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Cüzdan Kartı -->
        <div class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-6 rounded-2xl shadow-lg">
            <p class="text-sm opacity-80">Toplam Bakiye</p>
            <h3 id="walletBalance" class="text-3xl font-bold my-2">0.00 TL</h3>
            <p class="text-xs opacity-75 mt-4">IBAN Numarası:</p>
            <p id="walletIban" class="font-mono text-sm tracking-wider font-semibold">TR00 0000 0000 0000 0000 0000 00</p>
        </div>

        <!-- Para Transfer Formu -->
        <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm">
            <h3 class="text-lg font-bold text-gray-800 mb-4"><i class="fa-solid fa-paper-plane text-indigo-600"></i> Para Transferi Yap</h3>
            <div id="transferAlert" class="hidden mb-4 p-3 text-sm rounded-lg"></div>
            <form id="transferForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Gönderen IBAN</label>
                    <input type="text" id="fromIban" readonly class="mt-1 w-full p-2 bg-gray-100 border border-gray-300 rounded-md font-mono text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Alıcı IBAN</label>
                    <input type="text" id="toIban" placeholder="TR..." required class="mt-1 w-full p-2 border border-gray-300 rounded-md font-mono text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Tutar</label>
                    <input type="number" id="transferAmount" step="0.01" required class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition">Transferi Tamamla</button>
                </div>
            </form>
        </div>
    </div>

    <!-- İşlem Geçmişi Tablosu -->
    <div class="bg-white mt-6 p-6 rounded-2xl shadow-sm">
        <h3 class="text-lg font-bold text-gray-800 mb-4"><i class="fa-solid fa-list text-indigo-600"></i> Son İşlemler</h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-gray-600">
                <thead class="bg-gray-50 text-gray-700 uppercase text-xs">
                <tr>
                    <th class="p-3">Tarih</th>
                    <th class="p-3">Gönderen IBAN</th>
                    <th class="p-3">Alıcı IBAN</th>
                    <th class="p-3">Tutar</th>
                    <th class="p-3">İşlem</th>
                </tr>
                </thead>
                <tbody id="transactionTableBody">
                <!-- JavaScript ile dinamik dolacak -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
